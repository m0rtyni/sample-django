services:
  db:
    image: postgres:17
    
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d django"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    networks:
      - django-network

  web:
    build: .
    
    ports:
      - "8000:8000"
    
    environment:
      DB: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: django
      DB_USER: user
      DB_PASSWORD: user
      DB_SSLMODE: disable
    
    depends_on:
      db:
        condition: service_healthy

    networks:
      - django-network

volumes:
  postgres_data:

networks:
  django-network:
    driver: bridge