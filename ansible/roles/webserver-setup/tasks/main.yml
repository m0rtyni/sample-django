- name: Install web server dependencies
  ansible.builtin.dnf:
    name:
      - python3.12
      - python3.12-pip
      - git
      - nginx
      - libpq
    state: present

- name: Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Configure Nginx for Django
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/django.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Install Gunicorn systemd service
  ansible.builtin.template:
    src: gunicorn.service.j2
    dest: /etc/systemd/system/gunicorn.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

