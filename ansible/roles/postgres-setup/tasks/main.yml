- name: Install PostgreSQL server and Python dependencies
  ansible.builtin.dnf:
    name:
      - postgresql15
      - postgresql15-server
      - python3-psycopg2
      - acl
    state: present

- name: Check if PostgreSQL is initialized
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: postgres_data

- name: Initialize PostgreSQL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
  when: not postgres_data.stat.exists

- name: Start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL user
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    password: "{{ postgres_password }}"
    state: present
  become: true
  become_user: postgres

- name: Create PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    owner: "{{ postgres_user }}"
    state: present
  become: true
  become_user: postgres

- name: Allow PostgreSQL to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Allow application servers to connect to PostgreSQL
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    line: "host {{ postgres_db }} {{ postgres_user }} 10.0.0.0/16 scram-sha-256"
    state: present
  notify: Restart PostgreSQL
  